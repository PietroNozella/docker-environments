# Configuração do Nginx para o site estático
server {
    listen 80; # porta padrão HTTP (o compose mapeia 8080 -> 80)
    server_name localhost;

    # Raiz dos arquivos do site (montada via bind mount no compose)
    root /usr/share/nginx/html;
    index index.html;

    # Compressão: o Nginx envia gzip para o navegador, economizando banda
    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    # Cache de assets com hash (ex: style.css -> style.abc123.css) por 30 dias
    location ~* \.(css|js|png|jpg|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: qualquer rota que não seja arquivo serve o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}